<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LBANK Calculator</title>
  <link rel="stylesheet" href="style.css" />

  <!-- 스샷 저장용 -->
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
</head>
<body>

  <div class="page">

    <!-- 입력 패널 -->
    <div class="control-panel">
      <h2>LBANK 계산기</h2>

      <!-- 저장된 코드 목록 -->
      <label>
        저장된 코드 목록
        <select id="savedCodeSelect">
          <option value="">선택하세요</option>
        </select>
      </label>

      <!-- 저장 이름 -->
      <label>
        저장 이름
        <input id="saveNameInput" type="text" placeholder="예: 코드1" />
      </label>

      <!-- 추천 코드 -->
      <label>
        추천 코드 / 최대 5글자
        <input id="codeInput" type="text" value="A1ELS" maxlength="5" />
      </label>

      <div class="button-row">
        <button type="button" onclick="saveCode()">코드 저장</button>
        <button type="button" onclick="deleteSavedCode()">코드 삭제</button>
      </div>

      <hr class="panel-divider" />

      <label>
        날짜
        <input id="dateInput" type="date" value="2026-04-24" />
      </label>

      <label>
        시간
        <input id="timeInput" type="time" step="1" value="16:43:57" />
      </label>

      <label>
        포지션
        <select id="positionInput">
          <option value="ethusdt-perp">ETHUSDT Perp</option>
          <option value="btcusdt-perp">BTCUSDT Perp</option>
        </select>
      </label>

      <label>
        롱 / 숏
        <select id="sideInput">
          <option value="long">Open Long</option>
          <option value="short">Open Short</option>
        </select>
      </label>

      <label>
        레버리지 1~500
        <input id="leverageInput" type="number" min="1" max="500" value="14" />
      </label>

      <label>
        진입가
        <input id="entryInput" type="text" inputmode="numeric" pattern="[0-9]*" value="0" />
      </label>

      <label>
        목표가 / 청산가
        <input id="targetInput" type="text" inputmode="numeric" pattern="[0-9]*" value="0" />
      </label>

      <div class="button-row">
        <button type="button" onclick="calculateNow()">계산하기</button>
        <button type="button" onclick="downloadShot()">스샷 저장</button>
      </div>
    </div>

    <!-- 캡처될 카드 -->
    <div id="captureArea" class="capture-area">

      <img class="bg" src="assets/bg.png" alt="background" />

      <!-- 날짜 -->
      <div id="dateRender" class="date-render digit-row"></div>

      <!-- 포지션 -->
      <img id="positionRender" class="position-render" src="assets/position/ethusdt-perp.png" alt="position" />

      <!-- 롱 / 숏 -->
      <img id="sideRender" class="side-render" src="assets/side/long.png" alt="side" />

      <!-- 레버리지 -->
      <div id="leverageRender" class="leverage-render"></div>

      <!-- 수익률 -->
      <div id="pnlRender" class="pnl-render digit-row"></div>

      <!-- 진입가 -->
      <div id="entryRender" class="entry-render digit-row"></div>

      <!-- 목표가 / 청산가 -->
      <div id="targetRender" class="target-render digit-row"></div>

      <!-- 코드 값 -->
      <div id="codeValueRender" class="code-value-render"></div>

      <!-- 바코드 / QR 이미지 -->
      <div id="qrRender" class="qr-render">
        <img id="qrImage" src="assets/barcode/a.png" alt="barcode" />
      </div>

    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
